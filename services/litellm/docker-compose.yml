services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    restart: unless-stopped
    ports:
      # Loopback only. The single credential on this proxy is LITELLM_MASTER_KEY,
      # whose value is a well-known placeholder committed a few lines below - and with
      # no DATABASE_URL there are no scoped virtual keys to fall back on, so that one
      # string is the entire perimeter, and it grants admin (/key/generate, /model/*).
      # A bare "4000:4000" published that to the whole LAN. Containers reach the host
      # engines through host.docker.internal (outbound), so nothing needs 0.0.0.0.
      - "127.0.0.1:4000:4000"
    volumes:
      - ./config.yaml:/app/config.yaml
      - ./custom_hooks.py:/app/custom_hooks.py
      # Cross-turn preserve mode serve.sh writes per launch (off/full/window). custom_hooks.py
      # §C reads it to decide how much prior <think> to re-inline. Seeded file must PRE-EXIST
      # (else Docker bind-mounts a directory). Restart litellm once to pick this mount up.
      - ./preserve_state.json:/app/preserve_state.json:ro
      # Durable hook diagnostics. `docker logs` only covers the CURRENT container, and
      # editing any bind-mounted file here staled Docker-Desktop-on-WSL2's mount cache badly
      # enough to need `down` + `up -d` (a plain `restart` exits 127) — which DESTROYS the
      # log every time. Diagnosing what a client puts on the wire needs evidence that
      # outlives a redeploy, so custom_hooks.py also appends to this directory.
      - ./logs:/app/logs
    environment:
      - LITELLM_MASTER_KEY=sk-litellm-master-key
      # Temporary probe (2026-07-13): log what reasoning shape harnesses replay for the
      # qwen preserve_thinking models (custom_hooks.py §C). Set to 0 / remove once diagnosed.
      - CLUB3090_REASONING_DEBUG=1
      # Cloud reference route (qwen3.8-max*) — referenced as os.environ/DASHSCOPE_API_KEY
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0", "--num_workers", "1"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
