  # ComfyUI-compatible one. ⚠ NEVER BOOTED as of 2026-08-11 — first-boot checklist lives
  # in the compose header. Same 900 s timeout as the other 262K lane: a cold 255K prefill
  # is minutes, and a default client timeout reads that as a hang.
  - model_name: muse-glimmer-30b-dual
    litellm_params:
      model: openai/muse-glimmer-30b-dual
