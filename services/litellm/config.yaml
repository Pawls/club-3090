  # Qwen3.8-27B — dual-3090 llama.cpp lane WITH VISION at 262K, :8117.
  # Started by `./serve.sh 38b-dual` (lane added 2026-08-18).
  # 🧪 Experimental: booted + verify-full 9/9 + vision verified, but no soak/bench/8-pack. This is the only Qwen3.8 lane in the estate that serves IMAGES —
  # every upstream qwen3.8 slug is text-only.
  #
  # ⚠️ TIMEOUT: 5400 s — NOT the 900 s the other 262K lanes use. A cold deep-prefill is
  # minutes, not seconds, and a default client timeout reads that as a hang; on top of that,
  # an unbounded xhigh turn makes the timeout the de-facto thinking budget. The derivation
  # lives on the `timeout:` key below — keep the two in sync.
  #
  # ⭐ PER-REQUEST DIALS (this is why the lane exists for BoxelBuilder):
  #   chat_template_kwargs: {"enable_thinking": true|false,
  #                          "preserve_thinking": true|false,
  #                          "reasoning_effort": "low"|"medium"|"xhigh"}
  # All three are switchable per request with no reboot; server-side defaults MERGE per-key,
  # so a client may send only the dial it wants to change (measured 2026-08-18).
  # Server defaults: enable_thinking=false (--reasoning off), preserve_thinking=true,
  # reasoning_effort=low.
  #
  # ⚠️ A TOP-LEVEL `reasoning_effort` IS INERT on llama.cpp — it never reaches the template.
  # custom_hooks.py §E translates it into chat_template_kwargs and CLAMPS it, because an
  # out-of-set value (`minimal`/`none`) reaching the template is an HTTP 500, not a no-op.
  # Without that hook Hermes' effort picker does nothing here.
  #
  # ⚠️ The model_name must NOT contain the substring `qwen3.6-27b` — that would match
  # QWEN_PRESERVE_MODELS in custom_hooks.py and trigger the (C) re-inline path, which exists
  # for a vLLM field-drop bug that does NOT apply to llama.cpp. This template consumes the
  # reasoning_content FIELD directly, so re-inlining would double the thinking.
  - model_name: qwen3.8-27b-vision
    litellm_params:
      model: openai/qwen3.8-27b-vision
      api_base: http://host.docker.internal:8117/v1
      api_key: EMPTY
      # ⚠️ 5400 s, NOT the 900 s the other long-ctx lanes use — and the size is derived, not
      # picked. xhigh on this model is designed for an UNBOUNDED thinking budget (Qwen's card
      # asks for up to 262,144 reasoning tokens), and BoxelBuilder's "Auto" thinking budget
      # OMITS max_tokens entirely so the model runs to end-of-context. The engine imposes no
      # cap of its own (/props n_predict = -1) and neither does this proxy, so the request
      # TIMEOUT is the only remaining ceiling — i.e. it silently becomes the thinking budget.
      # MEASURED end-to-end through this proxy: 17,129 tokens in 384 s = 44.6 tok/s (incl.
      # prefill), finish_reason=stop, on an unbounded xhigh request.
      #     900 s -> ~40K tokens   (would truncate a routine 60K-thinking turn)
      #    3600 s -> ~161K tokens
      #    5400 s -> ~241K tokens  <- covers a turn that fills the 262,144 context
      # ⚠️ -np 1: one decode stream, so a long turn blocks the lane for its duration. That is
      # the accepted trade here; lower this if you would rather fail fast than wait.
      timeout: 5400
    # Context window, DECLARED for /model/info so a harness can autodetect it instead of
    # trusting a hand-typed number (PAWL's backends.probe_context reads
    # data[].model_info.max_input_tokens; null/0/missing = "no opinion" and it keeps its
    # own declared value). LiteLLM ECHOES this yaml — it never asks the engine — so a value
    # that drifts from the backend's real n_ctx is WORSE than null.
    #   Derivation (mtp-vision.yml, this lane's compose): -c ${CTX_SIZE:-262144} with
    #   -np ${NP:-1}, and no .env in the quant dir -> per-session window = 262144 / 1.
    #   Confirmed live 2026-08-30: GET :8117/props ->
    #   default_generation_settings.n_ctx = 262144, total_slots = 1.
    #   ⚠ On a lane running -np N the per-session window is n_ctx/N — declare THAT.
    # scripts/tests/test-litellm-context-window.sh re-derives this from the compose and
    # fails on drift; if you change CTX_SIZE or NP, that gate tells you to change this too.
    # max_output_tokens is deliberately NOT declared: /props n_predict is -1 (unbounded) and
    # the 5400 s timeout above is the only real ceiling, so any number here would be invented.
    model_info:
      max_input_tokens: 262144

  # Reasoning-effort aliases — SAME backend, SAME served model, only the template's
  # `reasoning_strength` differs. custom_hooks.py §D reads the level off the alias suffix and
  # injects it per request, so switching effort is "pick another model in the dropdown"
  # instead of rebooting the lane. Same trick as qwen3.8-max / -nothink below.
  # Costs nothing: no extra VRAM, no second process, no reload — one server, N front doors.
  # Meta advises high/xhigh for coding + agentic work, low/medium for chat latency.
  - model_name: muse-glimmer-30b-low
    litellm_params:
      model: openai/muse-glimmer-30b
      api_base: http://host.docker.internal:8210/v1
      api_key: EMPTY

