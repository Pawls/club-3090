  # Needle-verified 3/3 at 151K / 231K / 255K prompt tokens. ⚠ TTFT is ~5 MINUTES at
  # 255K — set a generous client timeout or it reads as a hang. No image input here.
  - model_name: muse-glimmer-30b-long
    litellm_params:
      model: openai/muse-glimmer-30b-long
      api_base: http://host.docker.internal:8211/v1
      api_key: EMPTY
      timeout: 900

