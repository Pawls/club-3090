model_list:
  # === Current serving primaries (one GPU service runs at a time per gpu-mode;
  #     routes to the inactive backends fail until that mode is brought up) ===

  # Qwen 3.6 27B — MTP n=3 + fp8/int8-PTH KV + 262K + vision.
  # Started by `gpu-mode 27b` → vllm-qwen36-27b-dual at :8010. Stack default.
  # NOTE: EVERY 27b scene (autoround / fp8 / awq / lmcache) serves the neutral shared
  # primary `qwen3.6-27b` (+ its own quant-specific name as an alias), so this route
  # matches whichever scene is on :8010 regardless of quant (#482/#490). The quant
  # differs by compose path/port + the scene's alias, NOT by the primary name.
  # DeepSeek-V4-Flash-0731 (284B MoE, CPU expert offload to host RAM).
  # Now a CATALOG SLUG: llamacpp/deepseek-flash-dual-q8 (#905), whose registry
  # default_port is 8030 — so this route matches the shipped slug, not a hand-launch.
  # The IQ2 sibling serves on 8031; add a second route if you want both reachable.
  - model_name: deepseek-v4-flash
    litellm_params:
      model: openai/deepseek-v4-flash
      api_base: http://host.docker.internal:8030/v1
      api_key: EMPTY

  # (fork: routes carry a topology suffix — see qwen3.6-27b-single / agents-a1-dual below.)
  - model_name: qwen3.6-27b-dual
    litellm_params:
      model: openai/qwen3.6-27b
      api_base: http://host.docker.internal:8010/v1
      api_key: EMPTY

  # Back-compat alias (pre-2026-07 clients that hardcode the old name); same upstream.
  # Hidden from the Hermes picker (2026-07-20 rename) — kept only so old refs resolve.
  - model_name: qwen3.6-27b-autoround
    litellm_params:
      model: openai/qwen3.6-27b
      api_base: http://host.docker.internal:8010/v1
      api_key: EMPTY

  # Qwen 3.6 27B VISION — SINGLE-card ik_llama IQ4_KS + mmproj, 160K ctx, MTP n=2.
  # For BoxelBuilder game-gen / screenshot work on one 3090 (frees the other card).
  # Launched via `serve.sh 27b-vision` → mtp-vision.yml at :8020 (--alias qwen3.6-27b-vision).
  # Shares the :8020 lane with 27b-minimal (GPU-mutex, one at a time); only THIS name is
  # routed here, so there's no ambiguity. Boot it before Hermes calls this model.
  - model_name: qwen3.6-27b-single
    litellm_params:
      model: openai/qwen3.6-27b-vision
      api_base: http://host.docker.internal:8020/v1
      api_key: EMPTY

  # Agents-A1 — InternScience 35B agentic MoE (⚠️ caveats; the agentic thinking-ON
  # specialist). Launched via `switch.sh vllm/agents-a1-dual` → vllm-agents-a1-dual
  # at :8072 (own port — never share a sibling's; see the slug-masquerade note).
  - model_name: agents-a1-dual
    litellm_params:
      model: openai/agents-a1
      api_base: http://host.docker.internal:8072/v1
      api_key: EMPTY

  # Qwen 3.6 35B-A3B (Intel AutoRound INT4 MoE) — 262K + vision, no MTP.
  # Launched via `launch.sh vllm/qwen-35b-a3b-dual` → vllm-qwen36-35b-a3b-dual at :8051.
  - model_name: qwen3.6-35b-a3b-dual
    litellm_params:
      model: openai/qwen3.6-35b-a3b-autoround
      api_base: http://host.docker.internal:8051/v1
      api_key: EMPTY

  # Qwen 3.6 35B-A3B STOCK + VISION — SINGLE-card ik_llama, 131K ctx. Stock base (NOT the apex
  # fine-tune), custom template with preserve_window. PRIMARY is now the unsloth UD-IQ4_XS
  # DYNAMIC quant (same ~18 GB as byteshape, more bits on the MoE router/attention → better
  # reasoning): `serve.sh ud-vision` → unsloth-ud-iq4xs/vision.yml at :8060 (--alias
  # qwen3.6-35b-a3b-vision). The prior byteshape IQ4_XS lane was retired 2026-07-21 (its
  # "shallow reasoning" turned out to be the ik cache-ram bleed, not the quant — see below).
  # Matched by the custom_hooks re-inline set ("qwen3.6-35b-a3b" tag), so cross-turn <think>
  # re-inline is active per preserve_state.json mode — PROVEN at this layer (recalled a secret
  # stashed only in a prior turn's reasoning field). End-to-end in Hermes depends on Hermes
  # replaying reasoning_content. Boot the model before Hermes calls it.
  - model_name: qwen3.6-35b-a3b-single
    litellm_params:
      model: openai/qwen3.6-35b-a3b-vision
      api_base: http://host.docker.internal:8060/v1
      api_key: EMPTY

  # Gemma 4 31B — dual-card @262K. Started by `gpu-mode gemma` at :8032.
  # EVERY gemma-31b scene now serves the neutral shared primary `gemma-4-31b` (+ its own
  # quant name as an alias: qat-awq-int4 / qat-w4a16 / autoround), so this route matches
  # whichever scene is on :8032 regardless of quant. This also repairs the prior drift:
  # the default is now cyankiwi qat-AWQ-INT4 (bf16 KV) — it never served
  # `gemma-4-31b-autoround`, so the old route would 404; the shared primary fixes it (#482).
  - model_name: gemma-4-31b-dual
    litellm_params:
      model: openai/gemma-4-31b
      api_base: http://host.docker.internal:8032/v1
      api_key: EMPTY

  # Back-compat alias; same upstream. Hidden from the Hermes picker (2026-07-20 rename).
  - model_name: gemma-4-31b-autoround
    litellm_params:
      model: openai/gemma-4-31b
      api_base: http://host.docker.internal:8032/v1
      api_key: EMPTY

  # (The old gemma-4-12b :8069 llama.cpp "chat brain" route was retired 2026-06-23 with the
  #  ai-studio consolidation — the studio uses the qwen director only.)

  # Gemma 4 12B (gemma4_unified arch, Intel AutoRound INT8) + bf16 KV + MTP n=2, single card.
  # Started by `gpu-mode gemma12b` → vllm-gemma-4-12b-int8-mtp at :8038 (served gemma-4-12b-int8).
  # Single-card scene: GPU-mutex with the dual models and ai-studio.
  - model_name: gemma-4-12b-single
    litellm_params:
      model: openai/gemma-4-12b-int8
      api_base: http://host.docker.internal:8038/v1
      api_key: EMPTY

  # NOTE: Gemma 4 26B-A4B is intentionally NOT routed — the registry default
  # (vllm/gemma-a4b, :8041) is the autoround-int4-mixed compose, which is
  # SM86-blocked (Marlin K-dim 704/128). The working AWQ variant
  # (vllm/gemma-a4b-awq, :8042) is not a gpu-mode primary; add a route here if
  # it gets promoted.

  # Qwen3.6-40B-Deckard (dense 40B uncensored, llama.cpp dual 3090, MTP n=2).
  # Launched via `launch.sh llamacpp/deckard40B-dual-mtp` → llama-cpp-deckard-40b at :8199.
  # Both-cards mode (GPU-mutex with ai-studio and all single-card services).
  - model_name: deckard-40b-dual
    litellm_params:
      model: openai/deckard-40b
      api_base: http://host.docker.internal:8199/v1
      api_key: EMPTY

  # deckard-40b-vision — SAME Deckard trunk on mainline llama.cpp + the Deckard-matched
  # mmproj (mradermacher, hidden 5120), so it accepts images. MTP traded away (mtmd ⊕
  # draft-mtp exclusive). Alternative to deckard-40b above; both selectable, one runs at
  # a time (GPU mutex). vision.yml @ :8200. llama-cpp/compose/dual/piehsoft-q6k/vision.yml.
  - model_name: deckard-40b-dual-vision
    litellm_params:
      model: openai/deckard-40b-vision
      api_base: http://host.docker.internal:8200/v1
      api_key: EMPTY

  # Qwen3.6-35B-A3B-Uncensored-HauhauCS ("hauhau" — MoE, llama.cpp dual 3090, MTP n=3,
  # reasoning ON, 262K). Launched via `launch.sh llamacpp/hauhaucs-35ba3b-dual` → :8073.
  # Both-cards mode (GPU-mutex). Served alias set to hauhau-35b via SERVED_NAME in its .env.
  - model_name: hauhau-35b-dual
    litellm_params:
      model: openai/hauhau-35b
      api_base: http://host.docker.internal:8073/v1
      api_key: EMPTY

  # === Local single-rig additions (Paul, 2026-07) — carnice / ik-single / omni ===

  # Carnice-V2-27B Q8 (beellama, dual) at :8070. Text-only agentic SFT.
  - model_name: carnice-v2-dual
    litellm_params:
      model: openai/Carnice-V2-27B-Q8_0-mtp.gguf
      api_base: http://host.docker.internal:8070/v1
      api_key: EMPTY

  # (apex-35b-compact / :8056 text-only ik_llama lane removed 2026-07-20 — Paul always
  #  picks dual 35b-a3b over it. The apex vision lanes below stay. serve.sh `apex` still
  #  boots the compose; it's just no longer routed through LiteLLM / shown in Hermes.)

  # apex-35b-vision — SAME APEX trunk on MAINLINE llama.cpp + Qwen3.6-35B-A3B mmproj,
  # so it accepts images (the ik-llama apex above cannot — no --mmproj). MTP off,
  # friendly --alias, single card @ :8058. GPU-mutex with every other GPU service.
  # llama-cpp/compose/single/mudler-apex-compact/vision.yml.
  - model_name: apex-35b-single-vision-mainline
    litellm_params:
      model: openai/apex-35b-vision
      api_base: http://host.docker.internal:8058/v1
      api_key: EMPTY

  # apex-35b-vision-ik — PREFERRED apex-vision: same ik_llama engine as the text apex
  # (keeps its MoE speed) + --mmproj, vs apex-35b-vision above which is on mainline
  # llama.cpp. Boot-verified 2026-07-10 (image round-trips, 42/42 layers on GPU). @:8057.
  # ik-llama/compose/single/mudler-apex-compact/vision.yml.
  - model_name: apex-35b-single-vision
    litellm_params:
      model: openai/apex-35b-vision-ik
      api_base: http://host.docker.internal:8057/v1
      api_key: EMPTY

  # Qwen3-Omni-30B (vllm-omni, dual) at :8042 — vision/audio brain. Full-path upstream id.
  # max_tokens is FORCE-CAPPED to 8192 by the custom_hooks.py pre-call hook (Hermes requires
  # context_length>=64K, then uses it AS max_tokens → 0 input room without the cap). See that file.
  - model_name: omni-30b-dual
    litellm_params:
      model: "openai//models/qwen3-omni-30b-a3b-instruct-int4-autoround"
      api_base: http://host.docker.internal:8042/v1
      api_key: EMPTY

  # === Cloud reference endpoint (DashScope MaaS workspace, OpenAI-compatible) ===
  # Qwen 3.8 Max Preview — first CLOUD reference for benchlocal-cli quality runs
  # (all prior references were local composes). Same endpoint pi uses.
  #
  # Thinking-only model: upstream REJECTS enable_thinking=false ("The value of the
  # enable_thinking parameter is restricted to True"), so the "thinking-off" arm is
  # realized as thinking_budget=1 (~1 reasoning token) via the -nothink alias's
  # extra_body — NOT enable_thinking=false. reasoning_effort is accepted but ignored.
  #
  # Rate limits prescribed to us: 500K TPM / 120 RPM per person, no token cap.
  # rpm/tpm below make LiteLLM pace/queue BEFORE the upstream 429s (with ~8% headroom).
  - model_name: qwen3.8-max
    litellm_params:
      model: openai/qwen3.8-max-preview
      api_base: https://ws-rcka3ndnpjlt5fku.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY
      rpm: 110
      tpm: 480000
  # "Thinking-off" arm: identical upstream, but thinking clamped to 1 token.
  - model_name: qwen3.8-max-nothink
    litellm_params:
      model: openai/qwen3.8-max-preview
      api_base: https://ws-rcka3ndnpjlt5fku.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY
      rpm: 110
      tpm: 480000
      extra_body: {"thinking_budget": 1}

# === Param handling (added 2026-07, revised after the reasoning_effort 400) ===
# drop_params: true → LiteLLM discards params it KNOWS a backend can't use (e.g.
# reasoning_effort, which Hermes sends unconditionally from agent.reasoning_effort but
# llama.cpp/vLLM chat endpoints reject). Without this it 400s the whole request.
# KEY: this only drops params in LiteLLM's KNOWN-OpenAI map. Non-OpenAI sampling
# extensions (top_k / min_p / repetition_penalty) are UNKNOWN to that map → passed
# through untouched. VERIFIED 2026-07-09 via direct-vs-proxied seeded diff: byte-identical
# generation with drop_params: true, so sampling fidelity is intact. (drop_params: false
# was wrong — it turned benign unsupported-param drops into hard 400s.)
litellm_settings:
  drop_params: true
  # Pre-call hook that force-caps omni-30b max_tokens (see custom_hooks.py). Client value
  # can't otherwise be overridden, and Hermes sends max_tokens=context_length (>=64K) for omni.
  callbacks: custom_hooks.proxy_handler_instance
