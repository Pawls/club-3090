      api_base: http://host.docker.internal:8210/v1
      api_key: EMPTY

  # -high is redundant with the bare alias TODAY (server default is high) but is listed
  # explicitly so the picker shows the whole ladder and so the level survives someone
  # changing REASONING_STRENGTH in the compose .env.
  - model_name: muse-glimmer-30b-high
    litellm_params:
      model: openai/muse-glimmer-30b
