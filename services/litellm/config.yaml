  # === Cloud reference endpoint (DashScope MaaS workspace, OpenAI-compatible) ===
  # Qwen 3.8 Max Preview — first CLOUD reference for benchlocal-cli quality runs
  # (all prior references were local composes). Same endpoint pi uses.
  #
  # Thinking-only model: upstream REJECTS enable_thinking=false ("The value of the
  # enable_thinking parameter is restricted to True"), so the "thinking-off" arm is
  # realized as thinking_budget=1 (~1 reasoning token) via the -nothink alias's
  # extra_body — NOT enable_thinking=false. reasoning_effort is accepted but ignored.
  #
  # Rate limits prescribed to us: 500K TPM / 120 RPM per person, no token cap.
  # rpm/tpm below make LiteLLM pace/queue BEFORE the upstream 429s (with ~8% headroom).
  - model_name: qwen3.8-max
    litellm_params:
      model: openai/qwen3.8-max-preview
      api_base: https://ws-rcka3ndnpjlt5fku.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY
      rpm: 110
      tpm: 480000
  # "Thinking-off" arm: identical upstream, but thinking clamped to 1 token.
  - model_name: qwen3.8-max-nothink
    litellm_params:
      model: openai/qwen3.8-max-preview
      api_base: https://ws-rcka3ndnpjlt5fku.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/DASHSCOPE_API_KEY
      rpm: 110
      tpm: 480000
      extra_body: {"thinking_budget": 1}

# === Param handling (added 2026-07, revised after the reasoning_effort 400) ===
# drop_params: true → LiteLLM discards params it KNOWS a backend can't use (e.g.
# reasoning_effort, which Hermes sends unconditionally from agent.reasoning_effort but
# llama.cpp/vLLM chat endpoints reject). Without this it 400s the whole request.
# KEY: this only drops params in LiteLLM's KNOWN-OpenAI map. Non-OpenAI sampling
# extensions (top_k / min_p / repetition_penalty) are UNKNOWN to that map → passed
# through untouched. VERIFIED 2026-07-09 via direct-vs-proxied seeded diff: byte-identical
# generation with drop_params: true, so sampling fidelity is intact. (drop_params: false
# was wrong — it turned benign unsupported-param drops into hard 400s.)
litellm_settings:
  drop_params: true
  # Pre-call hook that force-caps omni-30b max_tokens (see custom_hooks.py). Client value
  # can't otherwise be overridden, and Hermes sends max_tokens=context_length (>=64K) for omni.
  callbacks: custom_hooks.proxy_handler_instance
