  # Muse-Glimmer-30B (Meta, dense 30B + ViT-G/14 perception encoder, Apache 2.0).
  # Meta's official K-Quant-17GB GGUF on a LOCALLY BUILT llama.cpp (no upstream image
  # carries this arch yet), single GPU1, 131K, vision + the official DFlash drafter.
  # `./serve.sh muse` → llama-cpp-muse-glimmer-30b at :8210. Single-card (GPU mutex).
  # Measured 2026-08-10: 80.8 code / 74.2 prose TPS greedy (1.98x / 1.81x vs no
  # drafter), TTFT ~163 ms, 21.4 GiB peak. Tool calls + image input verified here.
  # ⚠ Two things that WILL surprise a caller through this route:
  #   1. Reasoning is billed against max_tokens and does NOT appear in `content` (it
  #      arrives in `reasoning_content`). A tight max_tokens returns a truncated
  #      answer with finish_reason=length, which reads as a broken model.
  #   2. Effort is NOT --reasoning / enable_thinking. It is the template kwarg
  #      `reasoning_strength` (low|medium|high|xhigh, default high, set per-boot via
  #      REASONING_STRENGTH). --think/--no-think correctly ERROR on this lane.
  - model_name: muse-glimmer-30b
    litellm_params:
      model: openai/muse-glimmer-30b
      api_base: http://host.docker.internal:8210/v1
      api_key: EMPTY

