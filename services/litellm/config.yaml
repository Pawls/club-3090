  # for ComfyUI / Boxel Builder, which is why this is the intended daily driver.
  # MEASURED: 21,578 MiB idle / 23,520 peak with images / 1,056 MiB free, and the peak is
  # FLAT with context depth (a 14 MB image at 209K tokens costs what it costs at 38K).
