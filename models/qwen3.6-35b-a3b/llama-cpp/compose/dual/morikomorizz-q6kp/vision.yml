# ===========================================================================
# Profile (at-a-glance):
#   Model:     Qwen3.6-35B-A3B-Uncensored-HauhauCS (morikomorizz Q6_K_P) + mmproj
#   Engine:    llama.cpp (mainline server-cuda-b9570)
#   Topology:  Dual 3090 (layer-split — inherits TENSOR_SPLIT from the shared .env)
#   Drafter:   MTP n=3 (--spec-type draft-mtp) — kept, alongside vision
#   KV:        q8_0 K + q8_0 V
#   Vision:    YES — Qwen3.6-35B-A3B mmproj-BF16 (~862 MB)
#   Template:  GGUF-embedded (--jinja)
#   Max ctx:   262144 (native; verify VRAM on boot — see the note below)
#   Genesis:   N/A — llama.cpp engine
#   Status:    🧪 Experimental
#   Caveats:
#     - VISION + MTP: kept BOTH. The engine (b9570) runs --mmproj and --spec-type
#       draft-mtp together — CONFIRMED on the sibling Deckard variant (same engine):
#       both load, images round-trip, MTP still drafts (~0.71 acceptance). MTP is
#       lossless and image tokens live in prefill, so vision quality is unchanged.
#       (This corrects the earlier belief that they were mutually exclusive.)
#     - UNVERIFIED on hauhau specifically until first boot — the engine capability is
#       confirmed, but hauhau's VRAM at 262K + MTP + the ~862 MB mmproj is tighter
#       than Deckard's. Check boot: mmproj loads + "speculative decoding context
#       initialized" + per-card free VRAM. If a card is tight, either trim CTX_SIZE
#       (e.g. 229376) or rebalance via VISION_TENSOR_SPLIT.
#     - Sibling of mtp.yml — same GGUF, same port/alias (8073 / hauhau-35b), a
#       DROP-IN SWAP: `down` mtp.yml, `up` vision.yml. Mutually exclusive (both bind
#       8073). Boot THIS when you need image input; flip Hermes supports_vision:true
#       for hauhau-35b when you do.
#     - Uncensored fine-tune — see mtp.yml for the content caveat.
#   Best for:  Uncensored dual-card 35B-A3B at 262K WITH vision AND MTP.
# ---------------------------------------------------------------------------
# Just mtp.yml + --mmproj. All shared knobs + the full model rationale: see the
# sibling mtp.yml header. Inherits the co-located .env (MODEL_DIR, CTX_SIZE,
# TENSOR_SPLIT, MTP_DRAFT_N_MAX, REASONING, PRESERVE_THINKING, SERVED_NAME, PORT).
# Override the split independently of mtp.yml via VISION_TENSOR_SPLIT if the vision
# tower unbalances the cards.
#
# Quick start (from this directory):
#   MODEL_DIR=/home/pawl/models docker compose -f vision.yml up -d
#   curl http://localhost:8073/v1/models   # -> hauhau-35b
# ===========================================================================
# Hardware metadata (parsed by scripts/preflight.sh):
# Requires-min-vram-gb: 48
# Engine-profile: llama-cpp-local
# Requires-min-gpu-count: 2
# Tensor-parallel: 1

services:
  llama-cpp-hauhaucs-35ba3b:
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda-b9570}
    container_name: "${ESTATE_CONTAINER:-llama-cpp-hauhaucs-35ba3b-vision}"
    restart: unless-stopped
    ports:
      - "${ESTATE_PORT:-${PORT:-8073}}:8080"
    volumes:
      - "${MODEL_DIR:-../../../../../../models-cache}:/models:ro"
    command: >-
      --host 0.0.0.0
      --port 8080
      -m /models/${GGUF_FILE:-qwen3.6-35b-a3b-uncensored-mtp-gguf/morikomorizz-q6kp/Qwen3.6-35B-A3B-Uncensored-HauhauCS-MTP-Q6_K_P.gguf}
      --mmproj /models/${MMPROJ_FILE:-qwen3.6-35b-a3b-gguf/mmproj/mmproj-BF16.gguf}
      --alias ${SERVED_NAME:-hauhaucs-35ba3b-dual}
      -c ${CTX_SIZE:-262144}
      -b ${BATCH_SIZE:-4096}
      -ub ${UBATCH_SIZE:-512}
      -ngl 99
      -ts ${VISION_TENSOR_SPLIT:-${TENSOR_SPLIT:-0.55,0.45}}
      -fa on
      --cache-type-k ${KV_TYPE:-q8_0}
      --cache-type-v ${KV_TYPE:-q8_0}
      -np ${NP:-1}
      --spec-type draft-mtp
      --spec-draft-n-max ${MTP_DRAFT_N_MAX:-3}
      --jinja
      --reasoning ${REASONING:-on}
      --reasoning-format ${REASONING_FORMAT:-deepseek}
      --chat-template-kwargs '{"preserve_thinking":${PRESERVE_THINKING:-false}}'
      --temp ${TEMP:-${TEMPERATURE:-0.6}}
      --top-p ${TOP_P:-0.95}
      --top-k ${TOP_K:-20}
      --min-p ${MIN_P:-0.0}
      --repeat-penalty ${REPEAT_PENALTY:-1.1}
      --repeat-last-n ${REPEAT_LAST_N:-256}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
