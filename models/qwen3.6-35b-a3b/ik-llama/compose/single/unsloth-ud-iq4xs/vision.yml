# ===========================================================================
# Profile (at-a-glance):
#   Model:     Qwen3.6-35B-A3B (unsloth UD-IQ4_XS 18.2 GB GGUF) + Qwen3.6-35B-A3B mmproj
#              — STOCK base (NOT a fine-tune). This is the QUALITY-UPGRADE sibling of
#              byteshape-iq4xs/vision.yml: SAME footprint, better quant.
#   Engine:    ik_llama.cpp (SAME image as the byteshape / apex vision composes)
#   Topology:  Single 3090 (GPU1 headless — frees GPU0 for the desktop / ComfyUI)
#   Drafter:   none (MTP head present in the GGUF but --spec-type dropped for vision
#              headroom — same call as byteshape/apex vision. Head tensors go unused.)
#   KV:        q4_0 K + q4_0 V — the fit at 131K + vision on this lane's 18.2 GB weights
#              (only ~3-4 GB KV headroom after weights + vision buffer). UNLIKE apex's small
#              ~10 GB compact quant (which has room for q8/q5 @262K), these UD weights are big:
#              q8/q5 (~4.7 GB @131K) is TIGHT and q8/q8 (~5.7 GB) OOMs at 131K. Only raise KV
#              if you also LOWER VISION_CTX_SIZE. q4_0 reasons fine anyway — 27b-vision proves
#              KV quant isn't the chain-of-thought lever (weight quant is).
#   Vision:    YES — mmproj-BF16 (~862 MB, shared stock projector). -b 1024 MANDATORY.
#   Template:  CUSTOM apex-qwen-chat-template.jinja (--jinja + --chat-template-file) —
#              preserve_thinking + preserve_window kwargs, behavior-equiv to native at
#              window=0. Same template as byteshape/apex (the a3b patches copy).
#   Max ctx:   131072 default via VISION_CTX_SIZE (raise stepwise — 35B-A3B KV is cheap,
#              so higher ctx is affordable; test at fill for the vision buffer).
#   Genesis:   N/A — Genesis is Qwen3-Next-specific; 35B-A3B is MoE.
#   Status:    🧪 Experimental — BOOT-VALIDATED 2026-07-21 (template renders in minja,
#              reasoning is deep — 2-3 numbers generated in <think>, NOT shallow — vision
#              round-trip correct [red/blue split image], and cache-clean over 8x repeats).
#              Full gate (verify-full / stress / soak / quality-test) still pending. Authored
#              2026-07-20 as the STOCK single-card vision lane at 27b-vision-grade quality:
#              unsloth DYNAMIC (UD) quant spends more bits on router/attention (the quant-
#              sensitive parts of a MoE) → the stock quality lane at byteshape's footprint.
#   Caveats:
#     - Weights not pulled by default: unsloth/Qwen3.6-35B-A3B-MTP-GGUF
#       (Qwen3.6-35B-A3B-UD-IQ4_XS.gguf, ~18.2 GB) + the stock mmproj.
#     - Distinct identity via own vars so it doesn't collide with the sibling text/vision
#       composes: UD_VISION_PORT default 8060, VISION_CTX_SIZE default 131072.
#     - Replaced byteshape-iq4xs/vision.yml (retired 2026-07-21) as the stock single-card
#       vision lane — byteshape's "shallow reasoning" was the ik cache-ram bleed, not its quant.
#   Best for:  STOCK single-card Qwen3.6-35B-A3B with vision — the stock quality lane. ⭐
# ---------------------------------------------------------------------------
# byteshape-iq4xs/vision.yml with the weights swapped to unsloth UD-IQ4_XS. Everything
# else (KV, template, -b 1024, MTP off, GPU pin) matches the byteshape/apex vision lanes.
#
# Quick start (from this directory):
#   MODEL_DIR=/home/pawl/models docker compose -f vision.yml up -d
#   curl http://localhost:8060/v1/models
#
# Override defaults via .env or shell (or serve.sh flags):
#   VISION_CTX_SIZE           context window       (default: 131072)
#   KV_TYPE_K / KV_TYPE_V     KV quant             (default: q4_0/q4_0; q8/q5+ needs a lower VISION_CTX_SIZE here)
#   IMAGE_MAX_TOKENS          image budget         (default: 1024 → ~1M-px)
#   PRESERVE_THINKING         keep prior <think>   (default: false — --preserve/--no-preserve)
#   PRESERVE_THINKING_WINDOW  keep last N blocks    (default: 0 = off; --preserve-window N)
#   REASONING                 thinking gate        (default: off — --think/--no-think)
#   UD_VISION_PORT            host port            (default: 8060)
# ===========================================================================
# Hardware metadata (parsed by scripts/preflight.sh):
# Requires-min-vram-gb: 24
# Engine-profile: ik-llama-local
# Requires-min-gpu-count: 1
# Tensor-parallel: 1

services:
  ik-llama-qwen36-35b-a3b-ud-vision:
    image: ${IK_LLAMA_IMAGE:-ghcr.io/ikawrakow/ik-llama-cpp@sha256:5f914f1ccade922417af58c94bd1cbb558052c8852d86678ead3fe693eec0143}
    container_name: "${ESTATE_CONTAINER:-ik-llama-qwen36-35b-a3b-ud-vision}"
    restart: unless-stopped
    ports:
      - "${ESTATE_PORT:-${UD_VISION_PORT:-8060}}:8080"
    volumes:
      - "${MODEL_DIR:-../../../../../../models-cache}:/models:ro"
      - ../../../patches/apex-qwen-chat-template.jinja:/etc/apex-qwen-chat-template.jinja:ro
    # WSL2: Docker device_ids does NOT isolate GPUs — pin via CUDA_VISIBLE_DEVICES inside
    # the container. =1 → GPU1 only, freeing GPU0 for the desktop. Matches the sibling lanes.
    environment:
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-1}
    # (Comments must stay OUT of the `command: >-` folded block — # is literal inside it.)
    command: >-
      --host 0.0.0.0
      --port 8080
      --model /models/${GGUF_FILE:-qwen3.6-35b-a3b-gguf/unsloth-ud-iq4xs/Qwen3.6-35B-A3B-UD-IQ4_XS.gguf}
      --mmproj /models/${MMPROJ_FILE:-qwen3.6-35b-a3b-gguf/mmproj/mmproj-BF16.gguf}
      --image-min-tokens ${IMAGE_MIN_TOKENS:-1024}
      --image-max-tokens ${IMAGE_MAX_TOKENS:-1024}
      --alias ${VISION_SERVED_NAME:-qwen3.6-35b-a3b-vision}
      --fit
      --fit-margin 256
      -ngl 99
      --ctx-size ${VISION_CTX_SIZE:-131072}
      -b ${BATCH_SIZE:-1024}
      -ub ${UBATCH_SIZE:-1024}
      -np ${NP:-1}
      -ctk ${KV_TYPE_K:-${KV_TYPE:-q4_0}}
      -ctv ${KV_TYPE_V:-${KV_TYPE:-q4_0}}
      -khad
      -vhad
      --recurrent-ckpt-mode auto
      --cache-ram ${CACHE_RAM:-0}
      --merge-qkv
      -fa on
      --jinja
      --chat-template-file /etc/apex-qwen-chat-template.jinja
      --parallel-tool-calls
      --reasoning ${REASONING:-off}
      --reasoning-format ${REASONING_FORMAT:-deepseek}
      --chat-template-kwargs '{"preserve_thinking":${PRESERVE_THINKING:-false}, "preserve_window":${PRESERVE_THINKING_WINDOW:-0}}'
      --temp ${TEMP:-${TEMPERATURE:-0.6}}
      --top-p ${TOP_P:-0.95}
      --top-k ${TOP_K:-20}
      --min-p ${MIN_P:-0.0}
      --repeat-penalty ${REPEAT_PENALTY:-1.0}
      --repeat-last-n ${REPEAT_LAST_N:-64}
      --presence-penalty ${PRESENCE_PENALTY:-0.0}
      --frequency-penalty ${FREQUENCY_PENALTY:-0.0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${ESTATE_GPUS:-${CUDA_VISIBLE_DEVICES:-1}}"]
              capabilities: [gpu]
