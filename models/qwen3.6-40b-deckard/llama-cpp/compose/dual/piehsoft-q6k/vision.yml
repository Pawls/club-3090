# ===========================================================================
# Profile (at-a-glance):
#   Model:     Qwen3.6-40B-Deckard (uncensored dense merge, Q6_K) + Deckard mmproj
#   Engine:    llama.cpp (mainline server-cuda-b9570)
#   Topology:  Dual 3090 (layer-split -ts 1,1 EVEN — vision+MTP overhead rebalances
#              the cards vs mtp.yml's 1.1,1.0; see the VRAM note below)
#   Drafter:   MTP n=2 (--spec-type draft-mtp) — YES, alongside vision
#   KV:        q8_0 K + q8_0 V
#   Vision:    YES — Deckard-matched mmproj-Q8_0 (~873 MiB mtmd)
#   Template:  GGUF-embedded (--jinja)
#   Max ctx:   131072 (inherits CTX_SIZE; vision+MTP both fit at the even split)
#   Genesis:   N/A — llama.cpp engine
#   Status:    🧪 Experimental
#   Caveats:
#     - VISION + MTP BOTH CONFIRMED WORKING TOGETHER 2026-07-10 (b9570). Earlier
#       belief that --mmproj and --spec-type draft-mtp were mutually exclusive was
#       WRONG for this build: both load ("[mtmd] mmproj 873 MiB" + "speculative
#       decoding context initialized"), an image round-trips correctly (finish_reason
#       =stop) AND MTP drafts during decode (measured draft acceptance ~0.71). MTP is
#       lossless (drafts verified vs the target), and image tokens live in prefill, so
#       the two are orthogonal — vision quality is unchanged and you keep the speedup.
#     - VRAM: mmproj (~873 MiB) + MTP draft context (~1226 MiB) add ~2.1 GB vs plain
#       text. At mtp.yml's 1.1,1.0 split that squeezed GPU0 (the desktop card) to
#       ~1.3 GB free — OOM-risky on a browser/VS Code spike. -ts 1,1 (EVEN, this
#       compose's default) rebalances to GPU0 ~3.2 GB / GPU1 ~2.2 GB free @131072 —
#       GPU0 keeps the bigger cushion for the desktop. If GPU0 still OOMs, step CTX
#       down (114688 / 98304); if GPU1 OOMs, nudge VISION_TENSOR_SPLIT to 1.1,1.0.
#     - This is a superset of the ✅ mtp.yml (adds vision at ~873 MiB VRAM). Keep
#       mtp.yml as the leaner max-headroom text option; boot THIS when you want images.
#       Distinct identity deckard-40b-vision @ :8200 so both stay selectable.
#     - Uncensored fine-tune — see mtp.yml for the content caveat.
#   Best for:  Deckard's uncensored dense chat WITH image input AND its MTP speedup. ⭐
# ---------------------------------------------------------------------------
# Vision mmproj: mradermacher's, built from the SAME DavidAU Deckard base our
# PiehSoft trunk derives from (PiehSoft injected only the MTP head into the LM; the
# vision tower is untouched). Matches Deckard's dense hidden_size 5120 / qwen3_5
# vision tower. Embedded --jinja template handles the image markers (verified).
#
# Shared knobs + full model/engine-pin rationale: see the sibling mtp.yml. This
# variant inherits the co-located .env (MODEL_DIR, CUDA_VISIBLE_DEVICES, CTX_SIZE,
# KV_TYPE, REASONING, PRESERVE_THINKING, MTP_DRAFT_N_MAX). Its OWN identity + split
# use distinct vars so the shared .env's PORT=8199 / TENSOR_SPLIT=1.1,1.0 (tuned for
# the no-vision mtp.yml) do not collide:
#   DECKARD_VISION_PORT   (default 8200)
#   VISION_SERVED_NAME    (default deckard-40b-vision)
#   VISION_TENSOR_SPLIT   (default 1,1 — even; the vision+MTP-safe split)
#
# Quick start (from this directory):
#   MODEL_DIR=/home/pawl/models docker compose -f vision.yml up -d
#   curl http://localhost:8200/v1/models   # -> deckard-40b-vision
# ===========================================================================
# Hardware metadata (parsed by scripts/preflight.sh):
# Requires-min-vram-gb: 48
# Engine-profile: llama-cpp-local
# Requires-min-gpu-count: 2
# Tensor-parallel: 1

services:
  llama-cpp-deckard-40b-vision:
    image: ${LLAMACPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-cuda-b9570}
    container_name: "${ESTATE_CONTAINER:-llama-cpp-deckard-40b-vision}"
    restart: unless-stopped
    ports:
      - "${ESTATE_PORT:-${DECKARD_VISION_PORT:-8200}}:8080"
    volumes:
      - "${MODEL_DIR:-../../../../../../models-cache}:/models:ro"
    # ⚠ -np 1 is intentional — one decode stream per dual-card config.
    command: >-
      --host 0.0.0.0
      --port 8080
      -m /models/${GGUF_FILE:-qwen3.6-40b-deckard-gguf/piehsoft-q6k/Qwen3.6-40B-Deckard-MTP-Q6_K.gguf}
      --mmproj /models/${MMPROJ_FILE:-qwen3.6-40b-deckard-gguf/mmproj/Qwen3.5-40B-Claude-4.6-Opus-Deckard-Heretic-Uncensored-Thinking.mmproj-Q8_0.gguf}
      --alias ${VISION_SERVED_NAME:-deckard-40b-vision}
      -c ${CTX_SIZE:-131072}
      -b ${BATCH_SIZE:-4096}
      -ub ${UBATCH_SIZE:-512}
      -ngl 99
      -ts ${VISION_TENSOR_SPLIT:-1,1}
      -fa on
      --cache-type-k ${KV_TYPE:-q8_0}
      --cache-type-v ${KV_TYPE:-q8_0}
      -np ${NP:-1}
      --spec-type draft-mtp
      --spec-draft-n-max ${MTP_DRAFT_N_MAX:-2}
      --jinja
      --reasoning ${REASONING:-off}
      --reasoning-format ${REASONING_FORMAT:-deepseek}
      --chat-template-kwargs '{"preserve_thinking":${PRESERVE_THINKING:-false}}'
      --temp ${TEMP:-${TEMPERATURE:-0.6}}
      --top-p ${TOP_P:-0.95}
      --top-k ${TOP_K:-20}
      --min-p ${MIN_P:-0.0}
      --repeat-penalty ${REPEAT_PENALTY:-1.1}
      --repeat-last-n ${REPEAT_LAST_N:-256}
      --dry-multiplier ${DRY_MULTIPLIER:-0.0}
      --dry-base ${DRY_BASE:-1.75}
      --dry-allowed-length ${DRY_ALLOWED_LENGTH:-2}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
