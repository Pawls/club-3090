# ===========================================================================
# Profile (at-a-glance):
#   Model:     Muse-Glimmer-30B (Meta official K-Quant-17GB GGUF, 4.81 bpw) + official mmproj
#   Engine:    llama.cpp (LOCALLY BUILT from master 030ebb5, sm_86) — see the pin caveat
#              in ../../single/meta-kquant-17gb/dflash-vision.yml; same image, same reason.
#   Topology:  Dual 3090 PCIe, NO NVLink (layer-split via -ts; NOT tensor-parallel)
#   Drafter:   DFlash n=15 (--spec-type draft-dflash + official dflash-kquant.gguf)
#   KV:        q8_0 K + q8_0 V (f16 is affordable here for the first time — see below)
#   Vision:    YES — official mmproj-kquant (~1.30 GiB). THE POINT OF THIS VARIANT:
#              262K *and* vision together, which does not fit on one card.
#   Template:  GGUF-embedded (--jinja) — channel format, NOT <think>
#   Max ctx:   262144 via --override-kv (the GGUF declares 131072)
#   Genesis:   N/A — Genesis is Qwen3-Next-specific
#   Status:    🧪 Experimental
#   Caveats:
#     - ✅ BOOTED AND MEASURED 2026-08-11. Vision + 262K + DFlash all confirmed running
#       TOGETHER on a layer split (the combination that was unproven). Numbers below are
#       measured unless labelled otherwise. Still unverified: hi-res image headroom and
#       needle retrieval at depth — see the checklist at the bottom.
#     - ⚠️ USES BOTH CARDS ⇒ NOT COMPATIBLE WITH ComfyUI (or anything else) ON GPU0.
#       That is the deliberate trade: boot this when GPU0 is free, boot
#       ../../single/meta-kquant-17gb/dflash-vision.yml (131K + vision, GPU1 only) when
#       it is not. GPU0 still carries the Windows desktop (~1.2 GiB), which is why the
#       default split leans to GPU1 — see TENSOR_SPLIT in the co-located .env.
#     - ⚠️ ABOVE THE VENDOR-VALIDATED WINDOW, same as the single long lane. Meta
#       validated to 131072. 262144 is reachable because the 13 full-attention layers
#       are NoPE (rope_theta=0) and the other 39 never see past their 2048 window, so
#       there is no RoPE extrapolation to break — but quality >131K is ours to prove.
#       The single-card long lane measured 9/9 needles at 151K/231K/255K; that is
#       retrieval, NOT reasoning-at-depth.
#     - ✅ VISION + 262K + DFLASH ALL AT ONCE: CONFIRMED 2026-08-11 on first boot, on a
#       layer split. Each pair was already known (vision+DFlash single-card 2026-08-10,
#       262K+DFlash single-card 2026-08-11); the trio was the open question and it works.
#       ⚠ Verify all three individually after any engine bump — "the server answers" does
#       NOT prove the drafter is live (the boot log says "loading draft model" even under
#       --spec-type none; trust draft_n in the response timings).
#     - BOTH --override-kv keys are REQUIRED (trunk AND drafter): llama-server hard-caps
#       the slot to n_ctx_train, so `-c 262144` alone yields a 400 "exceeds the available
#       context size". Overriding only the trunk leaves the drafter at 131072.
#     - -np 1 is load-bearing, and MEASURED so — see the concurrency section below.
#       Do not raise it hoping for 35b-a3b-style fan-out: that model is an MoE on vLLM,
#       this is a DENSE 30B on llama.cpp's static slots. -np 4 measured WORSE overall.
#   Best for:  One-box long-agentic work: 262K context WITH images, when GPU0 is free. ⭐
# ---------------------------------------------------------------------------
# WHY THIS VARIANT EXISTS
#
# The two single-card lanes each give up something, because 24 GiB cannot hold all of it:
#
#   single/dflash-vision.yml   131K + vision + DFlash    (gives up context)
#   single/long.yml            262K + DFlash, TEXT ONLY  (gives up vision — dropping the
#                                                         1.30 GiB mmproj is what pays
#                                                         for the extra KV)
#
# 48 GiB across two cards removes the choice.
#
# ===== MEASURED 2026-08-11 (idle, -c 262144, vision + DFlash, -ts 0.9,1.1) ============
#   GPU0  14937 MiB (14.59 GiB, INCLUDES ~1.5 GiB Windows desktop)  free  9.41 GiB
#   GPU1  14268 MiB (13.93 GiB)                                     free 10.07 GiB
#   TOTAL 28.52 GiB of 48 GiB                                       free 19.48 GiB
#   Boot to serving: 26 s (see the x4 note below — this did NOT crawl).
#
# ⚠️ THE PREDICTION IN THIS HEADER WAS WRONG BY ~6 GiB — it said ~22 GiB total. Kept as a
#   correction, not deleted: the naive sum (weights 15.61 + drafter 2.51 + mmproj 1.30 +
#   KV q8_0 1.73 + ~1 compute) UNDERCOUNTS a layer split, because compute/graph buffers
#   are allocated PER CARD rather than divided. Do not size a future multi-GPU lane by
#   halving a single-card footprint. (Probable explanation — this build does not print
#   the usual `CUDA0/CUDA1 buffer size` lines, so it is not confirmed from the log.)
#   The -ts 0.9,1.1 lean worked: excluding the desktop, GPU1 carries slightly more.
#
# ⇒ ~9.4 / ~10.1 GiB free per card (not the ~12 predicted). Still the second reason for
#   this variant: high-resolution image input SPIKES VRAM (a single-3090 report on
#   r/LocalLLaMA 1vkm42m had it "spike above 24GB", mitigated by capping input to ~3 Mpx).
#   The single-card 262K lane has ~3.6 GiB of headroom and had to drop vision partly for
#   that reason. ⚠ STILL UNVERIFIED HERE — test with a genuinely large image, not a
#   thumbnail, before relying on it.
#
# ===== SPEED vs THE SINGLE-CARD LANE — same harness, same prompt sizes ================
# (scratchpad ppd.py: /completion, cache_prompt=false, non-repeating filler, ignore_eos,
#  warmup discarded. Single-card figures are long.yml's, recorded in its header.)
#
#   prompt tok   prefill single -> dual      decode single -> dual     TTFT single -> dual
#     8,526      1278.6 -> 1655.5  (+29%)    163.8 -> 158.9  (-3%)      6.7 s ->   5.2 s
#    68,250      1141.2 -> 1565.9  (+37%)    156.8 -> 146.4  (-7%)     59.8 s ->  43.6 s
#   204,750       892.0 -> 1233.5  (+38%)    133.6 -> 124.5  (-7%)    229.5 s -> 166.0 s
#
# ⇒ PREFILL +30-38%, DECODE -3-7%. The decode dip is exactly what a layer split predicts:
#   the cards run SEQUENTIALLY (GPU0's layers, then GPU1's), so there is no bandwidth win,
#   only a per-token sync to pay. The headline win is TTFT at depth: 200K drops from
#   3.8 min to 2.8 min.
# ⚠ The prefill gain is LARGER than a sequential layer split should allow, so it probably
#   is not the second card's compute at all: `-fit on` most likely shrank the effective
#   microbatch under the single card's ~3.6 GiB headroom, while dual's ~10 GiB lets it run
#   at the full -ub 1024. HYPOTHESIS, not established — confirm by comparing FIT=off arms
#   before citing "dual prefills faster" as an architectural fact.
#
# f16 KV IS AFFORDABLE HERE, AND ONLY HERE (262144 f16 = 3.25 GiB, +1.52 over q8_0 —
# it does NOT fit alongside the drafter on one card). The default is still q8_0 for two
# deliberate reasons: (1) every measurement we have on this model is q8_0, so keeping it
# means this lane's numbers are comparable to both single-card lanes instead of confounding
# topology with KV precision, and (2) a sibling community thread measured q8_0 BEATING f16
# on prefill (609 vs 567 tok/s) with 3/3 needles at 200K, so q8_0 is not a fidelity
# compromise on this architecture. Flip both KV_TYPE_K/_V to f16 in the .env if you want
# max fidelity for a long agentic run and are willing to re-measure.
#
# KV arithmetic (only 13 of 52 layers hold long-range state — GQA 32Q/2KV, [L,L,L,G] SWA):
#   13 layers x 2 (K+V) x 2 KV heads x 128 head_dim = 6,656 values/token
#     q8_0: 7,072 B/tok  -> 262144 tok = 1.73 GiB
#     f16 : 13,312 B/tok -> 262144 tok = 3.25 GiB
#   ⚠ NEVER --swa-full: it forces all 52 layers to full length (~4x the KV).
#
# LAYER SPLIT, NOT TENSOR PARALLEL — and on this rig that distinction matters a lot.
# GPU1 sits in a PCIe 4.0 x4 slot. That cripples vLLM TP=2 (measured ~85 vs a reference
# 178 TPS) because tensor-parallel all-reduce moves a large tensor every layer. llama.cpp's
# default -sm layer does NOT do that: it passes the activation across the boundary once,
# ~13 KB/token at decode (hidden 6656 x 2 B), which is nothing even on x4. Prefill passes
# ~13.6 MB per ubatch boundary (1024 x 6656 x 2 B) ≈ 1.7 ms at x4 — also small next to the
# compute. ⇒ Expect layer-split dual to be roughly single-card speed, NOT the vLLM cliff.
# PREDICTION, NOT A MEASUREMENT: the one-time weight LOAD will be visibly slower (half the
# bytes cross the x4 link), and decode may lose a little to the extra hop. Measure both.
# Do NOT switch to -sm row on this rig without measuring: row split is the tensor-parallel
# traffic pattern that the x4 slot punishes.
#
# ===== CONCURRENCY (-np): MEASURED 2026-08-11, AND THE ANSWER IS "DON'T" =============
# The obvious idea on 48 GiB is 35b-a3b-style fan-out (that lane runs N=4). It does not
# transfer, for two architectural reasons and one measured one.
#
#   boot   concurrent   per-stream decode   aggregate    draft acceptance
#   -np 1       1           230.7 tok/s      230.7          94.4%
#   -np 1       2           227.9 tok/s      ~231           94.1%   (SERIALISED: 1 slot)
#   -np 4       1           174.0 tok/s      174.0          94.4%
#   -np 4       4            57.4 tok/s      229.6          71.4%
#
# ⇒ FOUR CONCURRENT STREAMS ON -np 4 PRODUCE THE SAME TOTAL TOKEN RATE AS ONE STREAM ON
#   -np 1 (229.6 vs 230.7 tok/s). You buy nothing in aggregate and pay 4x the per-request
#   latency. On top of that:
#     · -np 4 costs 25% of SINGLE-STREAM decode even when only one request is in flight
#       (174.0 vs 230.7) — the slots are not free to have.
#     · -c DIVIDES across slots: -np 4 -c 262144 gives n_ctx_slot=65536, CONFIRMED in the
#       boot log. Full 262K per slot needs -c 1048576 (KV 6.91 GiB, still fits).
#     · draft acceptance collapses 94.4% -> 71.4% under batching.
#
# WHY: DFlash and batching are SUBSTITUTES, not complements — both monetise the same idle
# compute during bandwidth-bound decode. At batch 1 a dense 30B reads all ~15.6 GB of
# weights per token, leaving spare FLOPs, which is exactly what the drafter converts into
# 1.9x. Batching wants those same FLOPs to amortise one weight read across 4 tokens. With
# the drafter already consuming them, there is nothing left for concurrency to harvest.
# And 35b-a3b is not a counterexample: it is an MoE (~3B active of 35B) on vLLM with
# CONTINUOUS batching and paged KV, whereas llama.cpp slots STATICALLY partition the pool.
#
# ⚠️ HONEST CAVEAT ON THIS TEST: it uses repetitive filler with ignore_eos, where draft
# acceptance is an unrealistic 94% — i.e. the drafter is at its BEST, so concurrency looks
# maximally pointless. On real prose acceptance is 11-22% (measured on the single-card
# lane at temp 1.0), leaving more spare compute, so batching would likely scale better
# than the table above. The single-stream -np 4 penalty and the -c division are NOT
# workload-dependent, though — those stand regardless.
#
# ⇒ RECOMMENDATION: keep -np 1 here. If you genuinely need parallel fan-out, use the MoE
#   lane (35b-a3b, vLLM, N=4) — it is the architecturally right tool. If you must batch
#   THIS model, first set SPEC_TYPE=none (the drafter is what concurrency is fighting) and
#   raise -c to 4x your real per-slot need, then re-measure before trusting it.
#
# Override defaults via .env (this directory) or shell (shell env wins):
#   CTX_SIZE          KV pool size             (default: 262144)
#                     ⚠ Safe to call CTX_SIZE here: this directory has its OWN .env. The
#                     single-card dir needed LONG_CTX_SIZE only because its two composes
#                     SHARE one .env that pins CTX_SIZE=131072.
#   OVERRIDE_CTX      the int: value in BOTH --override-kv keys (default: 262144)
#   TENSOR_SPLIT      layer split across cards (default: 0.9,1.1 — leans to GPU1 because
#                     GPU0 carries the Windows desktop AND the main-GPU-pinned mmproj +
#                     drafter). Ratio form, like the deckard/hauhau lanes.
#   KV_TYPE_K/_V      K / V quant              (defaults: q8_0 / q8_0; f16 fits here)
#   REASONING_STRENGTH low|medium|high|xhigh    (default: high — Meta advises high/xhigh
#                     for coding + agentic. Measured on the single-card lane: xhigh buys a
#                     reproducible +2/20 on hard agentic follow-through and NOTHING on
#                     simple tool dispatch, because the setting is a ceiling, not a floor.)
#   DFLASH_N_MAX      drafted tokens           (default: 15; upstream clamps above 15)
#   SPEC_TYPE         draft-dflash | none      (none = drafter OFF, frees 2.51 GiB)
#                     ⚠ The drafter COSTS prefill: measured -13.9% at 200K on the single
#                     long lane, so it needs a ~3.3K-token reply to pay for itself there.
#                     Same trade applies here. `none` for one short answer over a big dump.
#   UBATCH_SIZE       microbatch               (default: 1024 — measured 4% faster than
#                     512 on this rig, contra a community report)
#   SERVED_NAME / PORT                         (defaults: muse-glimmer-30b-dual / 8212)
#
# Quick start (from this directory — GPU0 must be free of ComfyUI):
#   MODEL_DIR=/home/pawl/models docker compose -f long-vision.yml up -d
#   curl http://localhost:8212/v1/models   # -> muse-glimmer-30b-dual
#
# FIRST-BOOT CHECKLIST — fill this in; until then every number above is a guess:
#   [x] n_ctx_slot = 262144 in the boot log — CONFIRMED (--override-kv took)
#   [x] mmproj loaded — CONFIRMED ("loaded multimodal model, mmproj-kquant.gguf")
#   [ ] a genuinely HI-RES image (not a thumbnail) does not OOM — the headroom claim.
#       ⚠ STILL THE BIGGEST UNVERIFIED CLAIM IN THIS HEADER, and headroom came in at
#       ~9.4/10.1 GiB per card rather than the ~12 predicted.
#   [x] drafting CONFIRMED — draft-dflash impl registered AND draft_n>0 with 59-94%
#       acceptance in response timings (the boot log's "loading draft model" line is
#       NOT proof: it prints under --spec-type none too)
#   [x] per-card VRAM measured (see the block above). TENSOR_SPLIT 0.9,1.1 is balanced;
#       no rebalance needed. This build does NOT print CUDA0/CUDA1 buffer sizes.
#   [ ] needle retrieval at ~255K (scratchpad needle.py) — confirm the single-card 9/9
#   [x] prefill + decode vs single card — MEASURED: prefill +30-38%, decode -3-7%.
#       The x4 layer-split penalty did NOT materialise the way this header predicted.
#   [x] weight-load wall time — 26 s to serving. The predicted "worst regression" was
#       WRONG; loading was not a problem at all.
#   [x] concurrency (-np) — measured, and the answer is "keep -np 1" (section above)
# ===========================================================================
# Hardware metadata (parsed by scripts/preflight.sh):
# Requires-min-vram-gb: 48
# Engine-profile: llama-cpp-local
# Requires-min-gpu-count: 2
# Tensor-parallel: 1
services:
  llama-cpp-muse-glimmer-30b-dual:
    image: ${LLAMACPP_IMAGE:-club3090/llama.cpp:server-cuda-master-030ebb5-sm86}
    container_name: "${ESTATE_CONTAINER:-llama-cpp-muse-glimmer-30b-dual}"
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-0.0.0.0}:${ESTATE_PORT:-${PORT:-8212}}:8080"
    volumes:
      - "${MODEL_DIR:-../../../../../../models-cache}:/models:ro"
    environment:
      # Pinned explicitly to BOTH cards so a stale CUDA_VISIBLE_DEVICES=1 exported by a
      # shell (the single-card lanes set exactly that) cannot silently halve this lane.
      - CUDA_VISIBLE_DEVICES=${DUAL_VISIBLE_DEVICES:-0,1}
    command: >-
      --host 0.0.0.0
      --port 8080
      -m /models/${GGUF_FILE:-muse-glimmer-30b-gguf/meta-kquant/muse-glimmer-30B-kquant-17gb.gguf}
      --mmproj /models/${MMPROJ_FILE:-muse-glimmer-30b-gguf/meta-kquant/mmproj-kquant.gguf}
      --spec-draft-model /models/${DFLASH_FILE:-muse-glimmer-30b-gguf/meta-kquant/dflash-kquant.gguf}
      --spec-type ${SPEC_TYPE:-draft-dflash}
      --spec-draft-n-max ${DFLASH_N_MAX:-15}
      -ngld ${DRAFT_NGL:-99}
      --override-kv muse-glimmer.context_length=int:${OVERRIDE_CTX:-262144},dflash.context_length=int:${OVERRIDE_CTX:-262144}
      --alias ${SERVED_NAME:-muse-glimmer-30b-dual}
      -c ${CTX_SIZE:-262144}
      -b ${BATCH_SIZE:-4096}
      -ub ${UBATCH_SIZE:-1024}
      -ngl 99
      -sm ${SPLIT_MODE:-layer}
      -ts ${TENSOR_SPLIT:-0.9,1.1}
      -fa ${FLASH_ATTN:-on}
      -fit ${FIT:-on}
      --cache-type-k ${KV_TYPE_K:-q8_0}
      --cache-type-v ${KV_TYPE_V:-q8_0}
      -np ${NP:-1}
      --cache-ram ${CACHE_RAM:-0}
      --jinja
      --reasoning-budget ${REASONING_BUDGET:--1}
      --chat-template-kwargs '{"reasoning_strength":"${REASONING_STRENGTH:-high}"}'
      --temp ${TEMP:-${TEMPERATURE:-1.0}}
      --top-p ${TOP_P:-0.95}
      --top-k ${TOP_K:-64}
      --min-p ${MIN_P:-0.0}
      --repeat-penalty ${REPEAT_PENALTY:-1.0}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
